# Scored by: eval/run_eval.py::pii_safety over the audit records AND the vendor REGISTER, which
# is the audit record's sibling sink and the one this repository's C3 row records as the place a
# citation actually leaked into.
#
# Two oracles because they fail independently: the pack scan uses the same rows the redactor masks
# with, so a redactor that skipped a field is caught; the planted-literal check fires even when a
# pattern row is broken, which is precisely when the first one cannot.
#
# `vendor` and `tenant` are outside the scan window on purpose. They are the row identity the
# store authorises on, so a scan that read them would go permanently red on any vendor whose NAME
# matched a pattern row, and a metric nobody can make green gets deleted rather than fixed.
#
# 0.99 is the fleet-wide bar for a safety-leak metric (practice E2).
metric: pii_safety
description: >
  No raw identifier survives into an audit record or into the long-lived vendor register,
  checked by the shared pack and by an independent planted literal.
threshold: 0.99
applies_to:
  - AuditEvent
  - RegisterEntry.citations
criteria:
  - id: pack_clean
    description: No scanned surface matches the shared pack rows the redactor masks with.
    weight: 0.5
  - id: planted_absent
    description: No case's planted identifier appears verbatim.
    weight: 0.5
denominator:
  kind: all-or-nothing
  note: One leak anywhere scores the run zero; corpus size is irrelevant to that.
direction: maximize
scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"
